<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Indev Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Tło rozciągające się na cały ekran z pliku background.png */
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Główne okno launchera wzorowane na szkicu */
        .launcher-window {
            width: 500px;
            height: 450px;
            background-color: #cccccc;
            border: 4px solid #000000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Górny pasek z tytułem */
        .window-header {
            height: 45px;
            border-bottom: 4px solid #000000;
            display: flex;
            align-items: center;
            padding-left: 15px;
            background-color: #dddddd;
        }

        .window-title {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            letter-spacing: 0.5px;
        }

        /* Główna zawartość okna z przyciskiem na dole */
        .window-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        /* Zaokrąglony, jaskrawozielony przycisk ze szkicu */
        .play-button {
            background-color: #a3e600;
            border: none;
            color: #ffffff;
            font-size: 26px;
            font-weight: 500;
            padding: 14px 70px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: lowercase; /* Tekst "play" pisany małymi literami jak na szkicu */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            transition: background-color 0.15s ease, transform 0.05s ease;
        }

        .play-button:hover {
            background-color: #b2f500;
        }

        .play-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="launcher-window">
        <!-- Górna sekcja okna -->
        <div class="window-header">
            <div class="window-title">Minecraft Indev Launcher</div>
        </div>

        <!-- Dolna sekcja okna z przyciskiem play -->
        <div class="window-body">
            <button class="play-button" onclick="launchGame()">Play</button>
        </div>
    </div>

    <script>
        function launchGame() {
            // Ciche uruchomienie pliku w tle bez pokazywania nazwy w strukturze okna
            window.location.href = "indev.html";
        }
    </script>

</body>
</html>
