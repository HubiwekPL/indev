<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Indev Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #111111;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Klimatyczne, ciemne tło z grafiką Minecrafta */
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
        }

        /* Główne okno launchera z lekką animacją wejścia i unoszenia się */
        .launcher-box {
            width: 420px;
            background: rgba(24, 24, 24, 0.92);
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 4px solid #111;
            
            animation: fadeInAndFloat 4s ease-in-out infinite alternate;
        }

        /* Logo / Nagłówek */
        .title-container {
            margin-bottom: 35px;
        }

        .title-main {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .title-sub {
            font-size: 13px;
            color: #ffb703;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Sekcja info o wersji */
        .version-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 40px;
            width: 100%;
        }

        .version-badge strong {
            color: #fff;
        }

        /* Przycisk GRAJ z efektem najechania i aktywacji */
        .play-btn {
            width: 100%;
            background: #5c8e32;
            border: none;
            border-bottom: 4px solid #3b5c20;
            color: white;
            padding: 16px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background 0.2s, transform 0.1s, border-bottom 0.1s;
            
            /* Subtelny puls przycisku zachęcający do kliknięcie */
            animation: pulseBtn 2s infinite;
        }

        .play-btn:hover {
            background: #69a239;
            animation-play-state: paused; /* Zatrzymuje pulsowanie przy najechaniu */
        }

        .play-btn:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        /* Ekran ładowania przy uruchamianiu gry */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 999;
        }

        .loading-overlay.active {
            opacity: 1;
        }

        /* ANIMACJE CSS */
        @keyframes fadeInAndFloat {
            0% {
                transform: translateY(0px);
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            }
            100% {
                transform: translateY(-10px);
                box-shadow: 0 40px 70px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(92, 142, 50, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(92, 142, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(92, 142, 50, 0); }
        }
    </style>
</head>
<body>

    <!-- Overlay do płynnego przejścia do gry -->
    <div class="loading-overlay" id="overlay"></div>

    <div class="launcher-box">
        <div class="title-container">
            <div class="title-main">Minecraft</div>
            <div class="title-sub">Indev Edition</div>
        </div>

        <div class="version-badge">
            Gotowy do gry: <strong>indev.html</strong>
        </div>

        <button class="play-btn" onclick="uruchomGre()">Graj</button>
    </div>

    <script>
        function uruchomGre() {
            const overlay = document.getElementById('overlay');
            overlay.classList.add('active');
            
            // Płynne przekierowanie po zakończeniu animacji ściemniania
            setTimeout(() => {
                window.location.href = "indev.html";
            }, 400);
        }
    </script>

</body>
</html>
